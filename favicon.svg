  <rect x="18" y="38" width="28" height="15" rx="3" fill="url(#cakeGrad)" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Frosting drips -->
  <path d="M18 41 Q21 44 24 41 Q27 44 30 41 Q33 44 36 41 Q39 44 42 41 Q45 44 46 41 L46 38 L18 38 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Cake Top Tier -->
