  <!-- Candle Flame -->
  <path d="M32 9 C30 13 29 15 32 17 C35 15 34 13 32 9 Z" fill="url(#flameGrad)"/>

  <!-- Sparkles -->
  <circle cx="14" cy="18" r="2" fill="#f59e0b"/>
  <circle cx="50" cy="22" r="2.5" fill="#ec4899"/>
  <circle cx="48" cy="48" r="2" fill="#38bdf8"/>
