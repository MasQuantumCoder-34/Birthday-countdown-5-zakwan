  </defs>

  <!-- Background circular party badge -->
  <circle cx="32" cy="32" r="30" fill="#fef08a" stroke="#1e293b" stroke-width="3"/>

  <!-- Cartoon Cloud Air Puff on left -->
  <path d="M12 40 C10 36 12 32 16 32 C17 28 22 28 24 31 C26 29 30 30 31 34 C33 34 35 37 34 40 C33 43 14 43 12 40 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>

